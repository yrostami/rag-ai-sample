spring.application.name=ragai

ragai.docs.location=docs/acme-cloud
ragai.ingest.on-startup=true
ragai.ingest.state-file=.ingest-state.properties

ragai.rerank.enabled=false
ragai.rerank.candidate-multiplier=3
ragai.rerank.max-candidates=9
#ragai.rerank.provider=qwen3-rerank
ragai.rerank.provider=cohere
ragai.rerank.cohere.base-url=https://api.avalai.ir/v1
#ragai.rerank.cohere.model=cohere-rerank-v4.0-pro
ragai.rerank.cohere.model=cohere-rerank-v4.0-fast
ragai.rerank.cohere.max-doc-chars=2000


spring.ai.openai.base-url=https://api.avalai.ir/v1
spring.ai.openai.api-key=${AVALAI_API_KEY}
#spring.ai.openai.chat.model=glm-5.3-flash
spring.ai.openai.chat.model=deepseek-v4.1-flash
spring.ai.openai.embedding.model=text-embedding-ada-002

spring.ai.vectorstore.chroma.client.host=http://localhost
spring.ai.vectorstore.chroma.client.port=8000
spring.ai.vectorstore.chroma.initialize-schema=true
spring.ai.vectorstore.chroma.tenant-name=ragai-tenant
spring.ai.vectorstore.chroma.database-name=ragai-db
spring.ai.vectorstore.chroma.collection-name=ragai-collection